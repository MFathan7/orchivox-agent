# appliesToGlob is matched against the request target_path, both the full path and the file name.
- id: no-todo-comments
  name: No TODO comments in source files
  appliesToGlob: "*.ts"
  triggerRegex: '//\s*TODO:'
  action: abort_and_retry
  reminderMessage: Write complete implementations without TODO comments

- id: no-console-log
  name: No console.log in source files
  appliesToGlob: "*.ts"
  triggerRegex: 'console\.log\('
  action: abort_and_retry
  reminderMessage: Use the project logging channel, do not use console.log

- id: no-any-type
  name: No any type in TypeScript files
  appliesToGlob: "*.ts"
  triggerRegex: 'any\b'
  action: abort_and_retry
  reminderMessage: Use specific types, do not use any
