# Clean template. Add or edit providers with /connect, then assign models with /models.
# To use your personal config in this repo, run: orchivox --config ~/.orchivox/config.yaml
# Values written as ${NAME} are replaced from environment variables at load time.
# A placeholder that resolves to nothing drops that key, so optional fields stay absent.
version: 1

providers:
  ollama:
    kind: ollama
    base_url: http://127.0.0.1:11434/v1
    models: []
    model_capabilities: {}
    headers: {}
    timeout_ms: 60000
    enabled: true
  Nvidia:
    kind: openai
    base_url: https://integrate.api.nvidia.com/v1
    models: []
    model_capabilities: {}
    headers: {}
    timeout_ms: 60000
    enabled: true
    catalog_provider: nvidia

roles: {}

inbound_server:
  port: 8787
  api_key: ${ORCHIVOX_INBOUND_KEY}
  enable_openapi: true
  enable_openclaude: true

lsp:
  servers:
    typescript:
      command: typescript-language-server
      args: [ "--stdio" ]
      root_markers: [ "tsconfig.json", "jsconfig.json", "package.json", "bunfig.toml" ]
    python:
      command: pylsp
      root_markers: [ "pyproject.toml", "setup.py", "requirements.txt" ]
    rust:
      command: rust-analyzer
      root_markers: [ "Cargo.toml" ]
    go:
      command: gopls
      root_markers: [ "go.mod" ]

mcp:
  servers:
    workspace_files:
      transport: stdio
      command: bunx
      args: [ "@modelcontextprotocol/server-filesystem", "." ]
    docs_lookup:
      transport: http
      url: https://mcp.example.net/docs
      headers:
        Authorization: Bearer ${MCP_DOCS_TOKEN}
      enabled: false

# Hook commands run in bash with ORCHIVOX_HOOK_PHASE, ORCHIVOX_TOOL_NAME, and
# ORCHIVOX_FILE_PATH exported; a failing pre_tool_use command blocks the tool call.
hooks:
  pre_tool_use: []
  post_tool_use:
    - match: hash_edit
      command: bunx prettier --write "$ORCHIVOX_FILE_PATH"
      timeout_ms: 60000
  on_stop: []

sandbox:
  permissions:
    filesystem:
      read: [ "**/*" ]
      write: []
      deny: [ ".git/**", ".env", ".env.*" ]
    network:
      allow: []
      deny: []
    commands:
      allow: []
      deny: []
      # escalate decides what happens when a sandboxed action hits a rule that needs a human call.
      escalate: ask
modes:
  build:
    reasoning: medium